
services:
  postgres:
    image: postgres:17
    container_name: dataset-watcher-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dataset_watcher
      POSTGRES_USER: watcher
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
